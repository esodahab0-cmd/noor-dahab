name: Build Noor Dahab Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'capacitor.config.json'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoorDahab-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0-apk
          name: "نور دهب - تطبيق أندرويد v2.0"
          body: |
            ### 📱 تطبيق نور دهب الرسمي للأندرويد (APK)
            - يعمل كتطبيق مستقل بدون الحاجة لأي متصفح.
            - دعم الصوت ثلاثي الأبعاد والاهتزازات الذكية.
            - رادار استشعار السقوط التلقائي.
            - يعمل محلياً في هاتفك بأعلى معايير الخصوصية.
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
