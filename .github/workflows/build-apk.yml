name: Build Noor Dahab Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses & Install SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          set -o pipefail
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee ../build_log.txt
          cd ..
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} ./nour-dahab-v2.apk \;

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nour-dahab-v2-apk
          path: ./nour-dahab-v2.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        if: success() && startsWith(github.ref, 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0-apk
          name: "نور دهب - تطبيق أندرويد الرسمي v2.0"
          body: |
            ### 📱 تطبيق نور دهب الرسمي للأندرويد (nour-dahab-v2.apk)
            - يعمل كتطبيق مستقل بدون الحاجة لأي متصفح.
            - متصل بالسيرفر الحي (https://dahabsoftware.online) ويتحدث تلقائياً مع كل تطوير في نفس اللحظة!
            - تفعيل كامل لصلاحيات الكاميرا والمايكروفون والحساسات.
            - دعم الصوت ثلاثي الأبعاد 3D والاهتزازات الذكية.
            - رادار استشعار السقوط التلقائي.
            - يعمل محلياً في هاتفك بأعلى معايير الخصوصية 100%.
          files: ./nour-dahab-v2.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Failure Log to Release
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-failure
          name: "Gradle Build Failure Log"
          body: "Automatic diagnostic log for failed Gradle APK build."
          files: build_log.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
